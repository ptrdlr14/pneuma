[package]
name = "pneuma"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# flex = 纯 Rust CPU 后备；metal = Apple GPU。运行时 BURN_DEVICE=flex|metal 切换。
burn = { version = "0.22.0-pre.3", default-features = false, features = ["std", "flex", "metal"] }
burn-store = { version = "0.22.0-pre.3", default-features = false, features = ["std", "safetensors", "memmap"] }
clap = { version = "4.6.7", features = ["derive"] }
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
zenoh = "1.10.1"
