[package]
name = "pneuma"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bon = "3.10.3"
# flex = 纯 Rust CPU；metal = Apple GPU；cuda = NVIDIA，始终编译进二进制。
# 运行时用 `--device` 或 BURN_DEVICE 选择：auto 按 CUDA → Metal → ROCm → … 顺序挑。
burn = { version = "0.22.0-pre.3", default-features = false, features = ["std", "flex", "metal", "cuda", "autodiff"] }
burn-pack = { version = "0.22.1", features = ["std"] }
burn-store = { version = "0.22.0-pre.3", default-features = false, features = ["std", "safetensors", "memmap"] }
clap = { version = "4.6.7", features = ["derive"] }
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
zenoh = "1.10.1"
