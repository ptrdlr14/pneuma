# SmolVLA LIBERO 合约模板：必须使用 state、processor 统计与动作语义一致的 checkpoint。
# 已发现的 lerobot/smolvla_libero 本地副本 config state=6、stats=8，不能直接加载。
# 此处采用 8 维 state，供明确确认该状态定义的 checkpoint 和数值参照使用。
deployment = "libero"
semantics = "libero-end-effector-delta-v1"

[model]
policy = "smolvla"
repo_or_path = "/absolute/path/to/native/smolvla-checkpoint"
device = "metal"

[execution]
supported_modes = ["chunk"]
action_fps = 10.0
action_deadline_s = 60.0
warmup_calls = 1

[zenoh]
mode = "peer"
listen_endpoints = ["tcp/127.0.0.1:7447"]

[[features]]
name = "observation.state"
shape = [8]
dtype = "float32"
semantics = "libero-eef-position-axis-angle-gripper-qpos-v1"

[[features]]
name = "observation.images.camera1"
shape = [256, 256, 3]
dtype = "uint8"
kind = "rgb"
semantics = "libero-camera1-rgb-v1"

[[features]]
name = "observation.images.camera2"
shape = [256, 256, 3]
dtype = "uint8"
kind = "rgb"
semantics = "libero-camera2-rgb-v1"

[[features]]
name = "observation.images.camera3"
shape = [256, 256, 3]
dtype = "uint8"
kind = "rgb"
semantics = "libero-camera3-rgb-v1"

[action_feature]
name = "action"
shape = [7]
dtype = "float32"
semantics = "libero-end-effector-delta-v1"
